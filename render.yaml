services:
  - type: web
    name: resume-screener-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString

databases:
  - name: resume-db
    plan: free
